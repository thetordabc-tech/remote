<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DOOMLIKE</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: 'Courier New', monospace;
  }
  #gameCanvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block;
    background: #000;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }

  #joyZoneL, #joyZoneR {
    position: absolute; bottom: 0; width: 45%; height: 42%;
    pointer-events: auto; z-index: 3;
  }
  #joyZoneL { left: 0; }
  #joyZoneR { right: 0; }

  .stick-base {
    position: absolute; width: 88px; height: 88px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 2px solid rgba(255,190,120,0.28);
    display: none;
  }
  .stick-nub {
    position: absolute; width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,150,60,0.30); border: 2px solid rgba(255,190,120,0.5);
    left: 25px; top: 25px;
  }

  #fireBtn {
    position: absolute; right: 18px; bottom: 22%; width: 76px; height: 76px;
    border-radius: 50%; background: rgba(150,20,10,0.30); border: 3px solid rgba(220,70,40,0.65);
    color: #f4c9a0; font-size: 12px; font-weight: bold; letter-spacing: 1px;
    display: flex; align-items:center; justify-content:center;
    pointer-events: auto; text-align: center; z-index: 4;
  }
  #fireBtn.active { background: rgba(255,90,40,0.55); }

  #muteBtn {
    position: absolute; top: 8px; left: 8px; width: 38px; height: 38px;
    background: rgba(0,0,0,0.5); border: 2px solid #5a3a22; border-radius: 3px;
    color: #d8b48a; font-size: 17px; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; z-index: 4; padding: 0;
  }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(150,25,10,0.55) 0%, rgba(20,4,2,0.9) 60%, #000 100%);
    color: #c8963c;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  .overlay h1 {
    font-size: clamp(38px, 15vw, 90px); margin: 0 0 6px; letter-spacing: 8px; font-weight: 900;
    color: #d6402a;
    text-shadow: 0 0 6px #ff6a20, 0 0 26px #a01000, 0 4px 0 #3a0a00, 0 6px 10px #000;
  }
  .overlay .sub {
    color: #8a6a3a; letter-spacing: 4px; font-size: 12px; margin-bottom: 18px;
  }
  .overlay p { color: #a89070; max-width: 400px; line-height: 1.65; font-size: 13px; margin: 6px 0; }
  .overlay .keyline { color: #d8b48a; }
  .overlay button {
    margin-top: 22px; padding: 15px 40px; font-size: 18px; font-weight: bold;
    font-family: inherit; letter-spacing: 3px;
    background: linear-gradient(#8e1d0e, #4a0c04); color: #f0c890;
    border: 2px solid #c8562c; border-radius: 3px;
    box-shadow: inset 0 1px 0 #d9743c, 0 3px 0 #2a0600;
  }
  .overlay button:active { transform: translateY(2px); box-shadow: inset 0 1px 0 #d9743c, 0 1px 0 #2a0600; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<button id="muteBtn">&#x1F50A;</button>
<div id="joyZoneL"><div class="stick-base" id="stickBaseL"><div class="stick-nub" id="stickNubL"></div></div></div>
<div id="joyZoneR"><div class="stick-base" id="stickBaseR"><div class="stick-nub" id="stickNubR"></div></div></div>
<div id="fireBtn">FIRE</div>

<div class="overlay" id="startScreen">
  <h1>DOOMLIKE</h1>
  <div class="sub">KNEE-DEEP IN THE BROWSER</div>
  <p class="keyline">LEFT STICK MOVE &nbsp;&middot;&nbsp; RIGHT STICK TURN &nbsp;&middot;&nbsp; FIRE</p>
  <p>Clear the installation of every demon. Grab shells, medikits and armor.</p>
  <p style="font-size:11px;color:#6a5a44">DESKTOP: WASD move &middot; mouse or arrows look &middot; SPACE fire</p>
  <button id="startBtn">START</button>
</div>

<div class="overlay" id="endScreen" style="display:none">
  <h1 id="endTitle">YOU DIED</h1>
  <div class="sub" id="endSub"></div>
  <p id="endText"></p>
  <button id="retryBtn">RESTART</button>
</div>

<script>
(() => {
"use strict";

/* =====================================================================
   1. PALETTE  —  VGA-style 256 colour palette + light-diminishing colormap
   ===================================================================== */
const PAL = new Uint8Array(768);
const PAL32 = new Uint32Array(256);

function ramp(i0, n, r0, g0, b0, r1, g1, b1) {
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0 : i / (n - 1);
    PAL[(i0 + i) * 3    ] = Math.round(r0 + (r1 - r0) * t);
    PAL[(i0 + i) * 3 + 1] = Math.round(g0 + (g1 - g0) * t);
    PAL[(i0 + i) * 3 + 2] = Math.round(b0 + (b1 - b0) * t);
  }
}
function buildPalette() {
  // Weighted towards the browns, rusts and reds Doom's own palette is built on,
  // otherwise mid-browns get quantised into the pink ramp.
  ramp(  0, 32,   0,  0,  0, 255,255,255);   // greys
  ramp( 32, 24,  18, 10,  5, 216,172,116);   // tan / wood
  ramp( 56, 24,  24,  8,  4, 196, 86, 44);   // rust / red-brown (brick, hide)
  ramp( 80, 24,  20,  0,  0, 255, 32, 20);   // reds / blood
  ramp(104, 16,  52, 18,  0, 255,168, 40);   // oranges / fire
  ramp(120, 16,  56, 46,  0, 255,244,120);   // yellows
  ramp(136, 16,   4, 24,  4,  72,255, 88);   // greens (armour, computers)
  ramp(152, 16,   8, 20, 10,  96,150,100);   // olive / sickly greens
  ramp(168, 16,   4,  6, 28,  90,130,255);   // blues
  ramp(184, 16,  46, 26, 18, 255,206,168);   // flesh tones
  ramp(200, 12,  60, 20, 26, 236,124,132);   // pink / meat
  ramp(212, 12,   2, 20, 22,  86,214,220);   // teals
  ramp(224, 16,  20,  6, 26, 168, 96,236);   // purples
  ramp(240, 16, 120, 60, 20, 255,255,220);   // hot highlights
  for (let c = 0; c < 256; c++) {
    PAL32[c] = (255 << 24) | (PAL[c*3+2] << 16) | (PAL[c*3+1] << 8) | PAL[c*3];
  }
}
buildPalette();

// 15-bit RGB -> nearest palette index lookup table
const LUT = new Uint8Array(32768);
(function buildLUT() {
  for (let r = 0; r < 32; r++) for (let g = 0; g < 32; g++) for (let b = 0; b < 32; b++) {
    const R = r * 8 + 4, G = g * 8 + 4, B = b * 8 + 4;
    let best = 0, bd = 1e12;
    for (let c = 0; c < 256; c++) {
      const dr = R - PAL[c*3], dg = G - PAL[c*3+1], db = B - PAL[c*3+2];
      const d = dr*dr*3 + dg*dg*6 + db*db*2;
      if (d < bd) { bd = d; best = c; }
    }
    LUT[(r << 10) | (g << 5) | b] = best;
  }
})();
function rgb2idx(r, g, b) { return LUT[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)]; }

// Named UI colours, resolved through the palette so index layout can change freely.
const C = {
  black:   rgb2idx(  0,   0,   0),
  frame:   rgb2idx( 18,  16,  14),
  red:     rgb2idx(216,  24,  12),
  dimRed:  rgb2idx( 84,  18,  10),
  yellow:  rgb2idx(240, 214,  60),
  green:   rgb2idx( 64, 224,  72),
  mapWall: rgb2idx(146,  40,  20),
  mapItem: rgb2idx(212, 190,  60),
  mapFoe:  rgb2idx(232,  44,  30),
  mapYou:  rgb2idx( 70, 240,  80)
};

// COLORMAP: 32 light levels, 0 = fullbright, 31 = black
const NLIGHT = 32;
const COLORMAP = new Uint8Array(NLIGHT * 256);
(function buildColormap() {
  for (let l = 0; l < NLIGHT; l++) {
    const f = (NLIGHT - 1 - l) / (NLIGHT - 1);
    for (let c = 0; c < 256; c++) {
      COLORMAP[l * 256 + c] = rgb2idx(PAL[c*3] * f | 0, PAL[c*3+1] * f | 0, PAL[c*3+2] * f | 0);
    }
  }
})();

/* =====================================================================
   2. BITMAP FONTS
   ===================================================================== */
const F3 = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110',
  E:'111100110100111', F:'111100110100100', G:'011100101101011', H:'101101111101101',
  I:'111010010010111', J:'001001001101010', K:'101101110101101', L:'100100100100111',
  M:'101111111101101', N:'110101101101101', O:'010101101101010', P:'110101110100100',
  Q:'010101101111011', R:'110101110101101', S:'011100010001110', T:'111010010010010',
  U:'101101101101111', V:'101101101101010', W:'101101111111101', X:'101101010101101',
  Y:'101101010010010', Z:'111001010100111',
  '0':'111101101101111', '1':'010110010010111', '2':'111001111100111', '3':'111001111001111',
  '4':'101101111001001', '5':'111100111001111', '6':'111100111101111', '7':'111001010010010',
  '8':'111101111101111', '9':'111101111001111',
  '%':'101001010100101', '/':'001001010100100', '.':'000000000000010', '!':'010010010000010',
  ':':'000010000010000', '-':'000000111000000', ' ':'000000000000000'
};
const FBIG = {
  '0':'01110,10001,10011,10101,11001,10001,01110',
  '1':'00100,01100,00100,00100,00100,00100,01110',
  '2':'01110,10001,00001,00010,00100,01000,11111',
  '3':'11111,00010,00100,00010,00001,10001,01110',
  '4':'00010,00110,01010,10010,11111,00010,00010',
  '5':'11111,10000,11110,00001,00001,10001,01110',
  '6':'00110,01000,10000,11110,10001,10001,01110',
  '7':'11111,00001,00010,00100,01000,01000,01000',
  '8':'01110,10001,10001,01110,10001,10001,01110',
  '9':'01110,10001,10001,01111,00001,00010,01100',
  '%':'11001,11010,00010,00100,01000,01011,10011',
  '-':'00000,00000,00000,11111,00000,00000,00000'
};

/* =====================================================================
   3. INDEXED IMAGE HELPERS
   ===================================================================== */
// roundRect is missing on older mobile Safari / WebView — polyfill before use.
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    const rad = Math.min(typeof r === 'number' ? r : 0, Math.abs(w) / 2, Math.abs(h) / 2);
    this.moveTo(x + rad, y);
    this.arcTo(x + w, y, x + w, y + h, rad);
    this.arcTo(x + w, y + h, x, y + h, rad);
    this.arcTo(x, y + h, x, y, rad);
    this.arcTo(x, y, x + w, y, rad);
    this.closePath();
    return this;
  };
}

function newSurface(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  return { c, g, w, h };
}
// convert a canvas to {w,h,data:paletteIndices, mask:opacity}
function indexize(surf) {
  const { g, w, h } = surf;
  const src = g.getImageData(0, 0, w, h).data;
  const data = new Uint8Array(w * h);
  const mask = new Uint8Array(w * h);
  for (let i = 0, p = 0; i < data.length; i++, p += 4) {
    if (src[p + 3] < 128) { mask[i] = 0; data[i] = 0; continue; }
    mask[i] = 1;
    data[i] = rgb2idx(src[p], src[p + 1], src[p + 2]);
  }
  return { w, h, data, mask };
}
function grain(g, w, h, amt) {
  const id = g.getImageData(0, 0, w, h);
  const d = id.data;
  for (let p = 0; p < d.length; p += 4) {
    if (d[p + 3] === 0) continue;
    const n = (Math.random() - 0.5) * amt;
    d[p    ] = Math.max(0, Math.min(255, d[p    ] + n));
    d[p + 1] = Math.max(0, Math.min(255, d[p + 1] + n));
    d[p + 2] = Math.max(0, Math.min(255, d[p + 2] + n));
  }
  g.putImageData(id, 0, 0);
}

/* =====================================================================
   4. WALL TEXTURES (64 x 128, Doom proportions) AND FLATS (64 x 64)
   ===================================================================== */
const TW = 64, TH = 128, FW = 64;

function texBrick() {                       // hell brick — brown/red masonry
  const s = newSurface(TW, TH), g = s.g;
  g.fillStyle = '#2a1008'; g.fillRect(0, 0, TW, TH);
  const rh = 16;
  for (let y = 0; y < TH; y += rh) {
    const off = ((y / rh) & 1) * 16;
    for (let x = -16; x < TW; x += 32) {
      const v = 0.72 + Math.random() * 0.42;
      g.fillStyle = `rgb(${(126*v)|0},${(58*v)|0},${(34*v)|0})`;
      g.fillRect(x + off + 1, y + 1, 30, rh - 2);
      g.fillStyle = `rgba(255,190,140,0.10)`;
      g.fillRect(x + off + 1, y + 1, 30, 1);
      g.fillStyle = `rgba(0,0,0,0.28)`;
      g.fillRect(x + off + 1, y + rh - 2, 30, 1);
    }
  }
  g.strokeStyle = 'rgba(120,40,10,0.55)'; g.lineWidth = 1;
  for (let i = 0; i < 7; i++) {                       // lava veins
    let x = Math.random() * TW, y = Math.random() * TH;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 5; k++) { x += (Math.random()-0.5)*16; y += (Math.random()-0.5)*22; g.lineTo(x, y); }
    g.stroke();
  }
  grain(g, TW, TH, 26);
  return indexize(s);
}
function texTech() {                        // grey tech panel with hazard band
  const s = newSurface(TW, TH), g = s.g;
  g.fillStyle = '#5f5f66'; g.fillRect(0, 0, TW, TH);
  for (let py = 0; py < TH; py += 32) {
    g.fillStyle = 'rgba(255,255,255,0.07)'; g.fillRect(0, py, TW, 1);
    g.fillStyle = 'rgba(0,0,0,0.45)';       g.fillRect(0, py + 31, TW, 1);
  }
  g.strokeStyle = 'rgba(20,20,24,0.8)'; g.lineWidth = 2;
  g.strokeRect(3, 3, TW - 6, TH - 6);
  g.fillStyle = '#33333a';
  for (let py = 10; py < TH; py += 32) for (let px = 8; px < TW; px += 24) {
    g.beginPath(); g.arc(px, py, 1.6, 0, 7); g.fill();
  }
  g.save();                                            // hazard stripes
  g.beginPath(); g.rect(0, TH * 0.44, TW, 14); g.clip();
  for (let x = -TH; x < TW * 2; x += 12) {
    g.fillStyle = (((x / 12) | 0) & 1) ? '#c9a318' : '#17171a';
    g.beginPath(); g.moveTo(x, TH); g.lineTo(x + 12, TH); g.lineTo(x + 26, 0); g.lineTo(x + 14, 0);
    g.closePath(); g.fill();
  }
  g.restore();
  grain(g, TW, TH, 20);
  return indexize(s);
}
function texComp() {                        // dark metal computer bank
  const s = newSurface(TW, TH), g = s.g;
  g.fillStyle = '#2b2f31'; g.fillRect(0, 0, TW, TH);
  g.fillStyle = '#1a1d1f';
  for (let py = 6; py < TH; py += 22) g.fillRect(4, py, TW - 8, 16);
  for (let py = 6; py < TH; py += 22) {
    for (let px = 7; px < TW - 8; px += 6) {
      const on = Math.random();
      g.fillStyle = on > 0.72 ? '#48ff58' : on > 0.5 ? '#136b18' : '#0d2a10';
      g.fillRect(px, py + 3, 3, 3);
      g.fillStyle = on > 0.85 ? '#ff5a2a' : '#3a1a10';
      g.fillRect(px, py + 9, 3, 3);
    }
  }
  g.strokeStyle = 'rgba(150,160,165,0.35)'; g.lineWidth = 1;
  g.strokeRect(1.5, 1.5, TW - 3, TH - 3);
  grain(g, TW, TH, 16);
  return indexize(s);
}
function texMarble() {                      // veined marble with gore streaks
  const s = newSurface(TW, TH), g = s.g;
  g.fillStyle = '#79786e'; g.fillRect(0, 0, TW, TH);
  for (let i = 0; i < 26; i++) {             // marble veins
    g.strokeStyle = `rgba(${40+Math.random()*40|0},${40+Math.random()*40|0},${38+Math.random()*36|0},0.5)`;
    g.lineWidth = Math.random() * 2 + 0.5;
    let x = Math.random() * TW, y = Math.random() * TH;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += (Math.random()-0.5)*24; y += (Math.random()-0.5)*30; g.lineTo(x, y); }
    g.stroke();
  }
  for (let i = 0; i < 5; i++) {              // blood running down
    const x = Math.random() * TW;
    const grd = g.createLinearGradient(0, TH * 0.15, 0, TH);
    grd.addColorStop(0, 'rgba(150,16,10,0.85)');
    grd.addColorStop(1, 'rgba(70,4,2,0.0)');
    g.fillStyle = grd;
    g.fillRect(x, TH * 0.15, 2 + Math.random() * 4, TH * 0.85);
  }
  g.fillStyle = 'rgba(0,0,0,0.35)';
  g.fillRect(0, 0, TW, 3); g.fillRect(0, TH - 3, TW, 3);
  grain(g, TW, TH, 18);
  return indexize(s);
}
function flatGrit(r, gg, b) {               // gritty floor flat
  const s = newSurface(FW, FW), g = s.g;
  g.fillStyle = `rgb(${r},${gg},${b})`; g.fillRect(0, 0, FW, FW);
  for (let i = 0; i < 420; i++) {
    const v = 0.6 + Math.random() * 0.8;
    g.fillStyle = `rgba(${(r*v)|0},${(gg*v)|0},${(b*v)|0},0.7)`;
    g.fillRect(Math.random()*FW|0, Math.random()*FW|0, 1 + (Math.random()*2|0), 1 + (Math.random()*2|0));
  }
  grain(g, FW, FW, 22);
  return indexize(s);
}
function flatPlate() {                      // riveted metal floor plate
  const s = newSurface(FW, FW), g = s.g;
  g.fillStyle = '#4e5257'; g.fillRect(0, 0, FW, FW);
  g.strokeStyle = 'rgba(20,22,24,0.8)'; g.lineWidth = 2;
  g.strokeRect(1, 1, FW - 2, FW - 2);
  g.beginPath(); g.moveTo(FW/2, 0); g.lineTo(FW/2, FW); g.moveTo(0, FW/2); g.lineTo(FW, FW/2); g.stroke();
  g.fillStyle = '#2c2f32';
  for (const [x, y] of [[6,6],[58,6],[6,58],[58,58],[32,6],[32,58],[6,32],[58,32]]) {
    g.beginPath(); g.arc(x, y, 2, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(2, 2, FW - 4, 2);
  grain(g, FW, FW, 16);
  return indexize(s);
}
function flatLight() {                      // ceiling with a recessed light fixture
  const s = newSurface(FW, FW), g = s.g;
  g.fillStyle = '#2e2c28'; g.fillRect(0, 0, FW, FW);
  g.fillStyle = '#141311';
  g.fillRect(0, 0, FW, 4); g.fillRect(0, 60, FW, 4); g.fillRect(0, 0, 4, FW); g.fillRect(60, 0, 4, FW);
  const grd = g.createRadialGradient(32, 32, 2, 32, 32, 20);
  grd.addColorStop(0, '#d8c47a'); grd.addColorStop(0.5, '#8e7a30'); grd.addColorStop(1, '#33302a');
  g.fillStyle = grd; g.fillRect(16, 16, 32, 32);
  g.strokeStyle = 'rgba(16,15,12,0.95)'; g.lineWidth = 2; g.strokeRect(16, 16, 32, 32);
  g.fillStyle = 'rgba(16,15,12,0.85)';                     // grille bars
  for (let i = 1; i < 4; i++) g.fillRect(16 + i * 8, 16, 1.5, 32);
  grain(g, FW, FW, 14);
  return indexize(s);
}

const WALLTEX = [null, texBrick(), texTech(), texComp(), texMarble()];
const FLATS = {
  grit:  flatGrit(96, 62, 34),
  ash:   flatGrit(62, 62, 60),
  blood: flatGrit(92, 20, 14),
  plate: flatPlate(),
  rock:  flatGrit(44, 40, 36),
  light: flatLight()
};

/* =====================================================================
   5. SPRITES
   ===================================================================== */
function impFrame(pose) {
  // pose: 0..3 walk, 4 attack, 5..9 death
  const s = newSurface(64, 64), g = s.g;
  const BODY = '#6d4a26', HI = '#9a6c38', DK = '#39230f', CLAW = '#ded0b4';
  const dying = pose >= 5;
  if (dying) {
    const k = pose - 5;                                     // 0..4 collapse
    const drop = k * 8, squash = 1 - k * 0.16;
    g.save(); g.translate(32, 62); g.scale(1 + k * 0.14, squash); g.translate(-32, -62);
    g.fillStyle = BODY;
    g.beginPath(); g.ellipse(32, 52 + drop * 0.4, 15 + k * 2, 10 - k, 0, 0, 7); g.fill();
    if (k < 3) {
      g.fillStyle = HI;
      g.beginPath(); g.ellipse(32, 40 + drop, 9 - k, 8 - k * 1.5, 0, 0, 7); g.fill();
    }
    g.fillStyle = '#8d1208';                                 // blood pool
    g.beginPath(); g.ellipse(32, 60, 12 + k * 4, 3 + k, 0, 0, 7); g.fill();
    if (k >= 3) {
      g.fillStyle = '#b4201a';
      for (let i = 0; i < 8; i++) {
        g.beginPath();
        g.ellipse(20 + Math.random()*24, 52 + Math.random()*8, 2+Math.random()*3, 1.5+Math.random()*2, 0, 0, 7);
        g.fill();
      }
    }
    g.restore();
    grain(g, 64, 64, 14);
    return indexize(s);
  }

}

/* ------- status bar face (returns a surface; scaled per resolution) ------- */
function faceSprite(tier, mode) {  // tier 0(best)..4, mode 'n'|'ouch'|'dead'|'grin'
  const s = newSurface(24, 29), g = s.g;
  if (mode === 'dead') {
    g.fillStyle = '#8a4a3a'; g.beginPath(); g.ellipse(12, 18, 10, 8, 0, 0, 7); g.fill();
    g.fillStyle = '#b0202a';
    for (let i = 0; i < 14; i++) {
      g.beginPath(); g.ellipse(3 + Math.random()*18, 12 + Math.random()*14, 1.5+Math.random()*2.5, 1+Math.random()*2, 0, 0, 7); g.fill();
    }
    g.fillStyle = '#e8e0d0'; g.fillRect(7, 15, 4, 2); g.fillRect(14, 15, 4, 2);
    g.fillStyle = '#2a0808'; g.fillRect(8, 15, 2, 2); g.fillRect(15, 15, 2, 2);
    return s;
  }
  // head
  g.fillStyle = '#d69a68'; g.beginPath(); g.ellipse(12, 16, 9, 11, 0, 0, 7); g.fill();
  g.fillStyle = '#b87a4a';                                    // jaw shadow
  g.beginPath(); g.ellipse(12, 22, 8, 5, 0, 0, 7); g.fill();
  g.fillStyle = '#5a3a1e';                                    // hair
  g.beginPath(); g.ellipse(12, 7, 9.5, 6, 0, 0, 7); g.fill();
  g.fillStyle = '#3d2612'; g.fillRect(3, 7, 18, 2);
  // eyes
  const look = mode === 'ouch' ? 0 : (Math.random() * 3 | 0) - 1;
  g.fillStyle = '#f2eee4'; g.fillRect(6, 13, 5, 3); g.fillRect(13, 13, 5, 3);
  g.fillStyle = '#1a2a3a';
  g.fillRect(8 + look, 13, 2, 3); g.fillRect(15 + look, 13, 2, 3);
  // brows — angrier as health drops
  g.fillStyle = '#3d2612';
  const bl = tier * 0.7;
  g.beginPath(); g.moveTo(5, 11 + bl); g.lineTo(11, 12 - bl * 0.4); g.lineTo(11, 13.4 - bl*0.4); g.lineTo(5, 12.4 + bl); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(19, 11 + bl); g.lineTo(13, 12 - bl * 0.4); g.lineTo(13, 13.4 - bl*0.4); g.lineTo(19, 12.4 + bl); g.closePath(); g.fill();
  // nose + mouth
  g.fillStyle = '#b87a4a'; g.fillRect(11, 16, 2, 4);
  if (mode === 'grin') {
    g.fillStyle = '#2a1008'; g.fillRect(7, 22, 10, 3);
    g.fillStyle = '#f0e8d4'; g.fillRect(7, 22, 10, 1.5);
  } else if (mode === 'ouch') {
    g.fillStyle = '#2a1008'; g.beginPath(); g.ellipse(12, 23, 4, 3, 0, 0, 7); g.fill();
  } else {
    g.fillStyle = '#7a3a22'; g.fillRect(8, 23, 8, 1.6);
  }
  // blood, increasing with damage
  if (tier > 0) {
    g.fillStyle = '#a81810';
    const n = tier * 4;
    for (let i = 0; i < n; i++) {
      const x = 3 + Math.random() * 18, y = 6 + Math.random() * 18;
      g.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 3);
    }
    if (tier >= 3) { g.fillRect(4, 9, 2, 12); g.fillRect(18, 11, 2, 9); }
  }
  return s;
}

function scaleSurface(src, h) {
  const w = Math.max(1, Math.round(src.w * h / src.h));
  const d = newSurface(w, h);
  d.g.imageSmoothingEnabled = false;
  d.g.drawImage(src.c, 0, 0, w, h);
  return indexize(d);
}
function buildFaces(h) {

    grin: FACE_SRC.grin.map(s => scaleSurface(s, h)),
    dead: scaleSurface(FACE_SRC.dead, h)
  };
}

    id = null; base.style.display = 'none'; onEnd();
    if (e.cancelable) e.preventDefault();
  }
  zone.addEventListener('touchstart', start, { passive: false });
  zone.addEventListener('touchmove', move, { passive: false });
  zone.addEventListener('touchend', end, { passive: false });
  zone.addEventListener('touchcancel', end, { passive: false });
  zone.addEventListener('mousedown', start);
  window.addEventListener('mousemove', e => { if (id !== null) move(e); });
  window.addEventListener('mouseup', e => { if (id !== null) end(e); });
}

/* =====================================================================
   11. RENDERING
   ===================================================================== */
function renderWorld() {
  const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
  const planeX = -dirY * FOV_SCALE, planeY = dirX * FOV_SCALE;
  const px = player.x, py = player.y;

  for (let x = 0; x < IW; x++) {
    const cam = 2 * x / IW - 1;
    const rdx = dirX + planeX * cam, rdy = dirY + planeY * cam;

    // --- DDA ---
    let mapX = px | 0, mapY = py | 0;
    const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
    const ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
    let stepX, stepY, sdx, sdy;
    if (rdx < 0) { stepX = -1; sdx = (px - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - px) * ddx; }
    if (rdy < 0) { stepY = -1; sdy = (py - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - py) * ddy; }
    let side = 0, hit = 0, guard = 0;
    while (guard++ < 96) {
      if (sdx < sdy) { sdx += ddx; mapX += stepX; side = 0; }
      else { sdy += ddy; mapY += stepY; side = 1; }
      if (mapX < 0 || mapY < 0 || mapX >= MAP_W || mapY >= MAP_H) { hit = 1; break; }
      if (MAP[mapY][mapX] > 0) { hit = 1; break; }
    }
    let perp = side === 0 ? sdx - ddx : sdy - ddy;
    if (perp < 0.02) perp = 0.02;
    zbuf[x] = perp;

    const cellI = (Math.min(MAP_H - 1, Math.max(0, mapY)) * MAP_W) + Math.min(MAP_W - 1, Math.max(0, mapX));
    const tex = WALLTEX[TEXMAP[cellI]] || WALLTEX[1];

    // --- wall column ---
    const lineH = (WALL_H * PROJ) / perp;
    const drawStartF = HORIZON - lineH / 2;
    let y0 = Math.ceil(drawStartF), y1 = Math.floor(drawStartF + lineH);
    if (y0 < 0) y0 = 0;
    if (y1 > VIEW_H) y1 = VIEW_H;

    let wallX = side === 0 ? py + perp * rdy : px + perp * rdx;
    wallX -= Math.floor(wallX);
    let texX = (wallX * TW) | 0;
    if ((side === 0 && rdx > 0) || (side === 1 && rdy < 0)) texX = TW - 1 - texX;

    let light = distLight(perp) + (side === 1 ? 2 : 0);
    if (light > NLIGHT - 1) light = NLIGHT - 1;
    const cmap = light * 256;

    const tstep = TH / lineH;
    let texPos = (y0 - drawStartF) * tstep;
    const tdata = tex.data;
    for (let y = y0; y < y1; y++) {
      const ty = texPos & (TH - 1);
      texPos += tstep;
      screenIdx[y * IW + x] = COLORMAP[cmap + tdata[(ty | 0) * TW + texX]];
    }

    // --- floor and ceiling for this column ---
    for (let y = y1; y < VIEW_H; y++) {
      const p = y - HORIZON;
      if (p < 1) continue;
      const d = rowDist[p];
      const fx = px + rdx * d, fy = py + rdy * d;
      const cx = fx | 0, cy = fy | 0;
      const inMap = cx >= 0 && cy >= 0 && cx < MAP_W && cy < MAP_H;
      const flat = FLATLIST[inMap ? FLOORMAP[cy * MAP_W + cx] : 3];
      const tx = ((fx * FW) | 0) & 63, ty = ((fy * FW) | 0) & 63;
      screenIdx[y * IW + x] = COLORMAP[rowLight[p] * 256 + flat.data[ty * FW + tx]];
    }
    for (let y = 0; y < y0; y++) {
      const p = HORIZON - y;
      if (p < 1) continue;
      const d = rowDist[p];
      const fx = px + rdx * d, fy = py + rdy * d;
      const cx = fx | 0, cy = fy | 0;
      const inMap = cx >= 0 && cy >= 0 && cx < MAP_W && cy < MAP_H;
      const flat = FLATLIST[inMap ? CEILMAP[cy * MAP_W + cx] : 3];
      const tx = ((fx * FW) | 0) & 63, ty = ((fy * FW) | 0) & 63;
      screenIdx[y * IW + x] = COLORMAP[rowLight[p] * 256 + flat.data[ty * FW + tx]];
    }
  }
}

const drawList = [];
function renderThings() {
  const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
  const planeX = -dirY * FOV_SCALE, planeY = dirX * FOV_SCALE;
  const invDet = 1 / (planeX * dirY - dirX * planeY);

  drawList.length = 0;
  for (const e of enemies) {
    if (!e.alive && e.deathT < 0) continue;
    drawList.push(e);
  }
  for (const it of items) if (it.alive) drawList.push(it);
  for (const p of projectiles) drawList.push(p);

  for (const t of drawList) {
    const sx = t.x - player.x, sy = t.y - player.y;
    t._d = sx * sx + sy * sy;
  }
  drawList.sort((a, b) => b._d - a._d);

  for (const t of drawList) {
    const sx = t.x - player.x, sy = t.y - player.y;
    const tX = invDet * (dirY * sx - dirX * sy);
    const tY = invDet * (-planeY * sx + planeX * sy);
    if (tY < 0.12) continue;

    let img, worldH, worldW, extraLight = 0;
    if (t.kind === 'imp' || t.kind === 'pinky') {
      const def = ENEMY_DEF[t.kind];
      const set = SPR[t.kind];
      let fi;
      if (!t.alive) fi = 5 + Math.min(4, t.deathFrame);
      else if (t.attackT > 0) fi = 4;
      else fi = t.frame & 3;
      img = set[fi];
      worldH = def.worldH; worldW = def.worldW;
      if (t.hitT > 0) extraLight = -6;
    } else if (t.kind === 'fireball') {
      img = SPR.fire[(t.anim | 0) & 3];
      worldH = 0.5; worldW = 0.5; extraLight = -24;
    } else {
      img = SPR[t.kind];
      worldH = t.kind === 'bonus' ? 0.35 : 0.42;
      worldW = worldH;
      extraLight = -3;
    }

    const spriteH = (worldH * PROJ) / tY;
    const spriteW = (worldW * PROJ) / tY;
    const screenX = (IW / 2) * (1 + tX / tY);
    const floorY = HORIZON + (EYE_Z * PROJ) / tY;
    const bottom = t.kind === 'fireball' ? floorY - (0.6 * PROJ) / tY : floorY;
    const top = bottom - spriteH;

    let light = distLight(tY) + extraLight;
    if (light < 0) light = 0; if (light > NLIGHT - 1) light = NLIGHT - 1;
    const cmap = light * 256;

    const x0 = Math.max(0, Math.floor(screenX - spriteW / 2));
    const x1 = Math.min(IW, Math.ceil(screenX + spriteW / 2));
    const y0 = Math.max(0, Math.floor(top));
    const y1 = Math.min(VIEW_H, Math.ceil(bottom));
    if (x1 <= x0 || y1 <= y0) continue;

    const iw = img.w, ih = img.h;
    const invW = iw / spriteW, invH = ih / spriteH;
    const leftEdge = screenX - spriteW / 2;

    for (let x = x0; x < x1; x++) {
      if (zbuf[x] <= tY) continue;
      const tx = ((x - leftEdge) * invW) | 0;
      if (tx < 0 || tx >= iw) continue;
      for (let y = y0; y < y1; y++) {
        const ty = ((y - top) * invH) | 0;
        if (ty < 0 || ty >= ih) continue;
        const si = ty * iw + tx;
        if (!img.mask[si]) continue;
        screenIdx[y * IW + x] = COLORMAP[cmap + img.data[si]];
      }
    }
  }
}

function renderWeapon() {
  const img = SPR.gun[weapon.frame];
  const scale = Math.max(1, (IW * 0.50) / img.w);
  const w = img.w * scale, h = img.h * scale;
  const bobX = Math.sin(player.bob) * (IW * 0.014);
  const bobY = Math.abs(Math.cos(player.bob)) * (VIEW_H * 0.016);
  const dx = Math.round((IW - w) / 2 + bobX);
  const dy = Math.round(VIEW_H - h + bobY);
  blitSprite(img, dx, dy, scale, 2, VIEW_H);
}

function renderAutomap() {
  const size = Math.max(34, Math.min(58, Math.floor(IW * 0.24)));
  const ox = IW - size - 3, oy = 3;
  const cs = size / MAP_W;
  fillRect(ox - 2, oy - 2, size + 4, size + 4, C.frame);       // dark frame
  fillRect(ox - 1, oy - 1, size + 2, size + 2, C.black);
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (MAP[y][x] > 0) fillRect(ox + x * cs, oy + y * cs, Math.ceil(cs), Math.ceil(cs), C.mapWall);
  }
  for (const it of items) {
    if (!it.alive) continue;
    fillRect(ox + it.x * cs - 0.5, oy + it.y * cs - 0.5, 1, 1, C.mapItem);
  }
  for (const e of enemies) {
    if (!e.alive) continue;
    fillRect(ox + e.x * cs - 1, oy + e.y * cs - 1, 2, 2, C.mapFoe);
  }
  const pxm = ox + player.x * cs, pym = oy + player.y * cs;
  fillRect(pxm - 1, pym - 1, 2, 2, C.mapYou);
  fillRect(pxm + Math.cos(player.angle) * 4 - 0.5, pym + Math.sin(player.angle) * 4 - 0.5, 1, 1, C.mapYou);
}

function faceTier() {
  const h = player.health;
  if (h > 80) return 0; if (h > 60) return 1; if (h > 40) return 2; if (h > 20) return 3;
  return 4;
}
function smallWidth(text, sc) { return text.length * 4 * sc - sc; }
function drawSmallCentered(cx, y, text, c, sc) {
  drawSmall(Math.round(cx - smallWidth(text, sc) / 2), y, text, c, sc);
}
function renderStatusBar() {
  const top = VIEW_H;

  fillRect(fx - 2, fy - 1, face.w + 4, face.h + 2, rgb2idx(20, 18, 16));

  // --- KILLS tally ---
  const kx = F(0.755);
  drawSmall(kx, numY + 1, 'KILLS', YEL, LAB_SC);

function renderOverlays() {
  // damage / pickup tint applied over the 3D view
  if (player.hurtFlash > 0.01) {
    const amt = Math.min(1, player.hurtFlash);
    const lv = Math.max(0, 8 - Math.round(amt * 8));
    for (let y = 0; y < VIEW_H; y++) {

      for (let x = 0; x < IW; x++) {
        const i = row + x;
        const c = screenIdx[i];
        const r = Math.min(255, PAL[c*3] + 90 * amt);

        screenIdx[i] = rgb2idx(r | 0, g | 0, b | 0);
      }
    }
  } else if (player.pickFlash > 0.01) {

    for (let y = 0; y < VIEW_H; y++) {

      for (let x = 0; x < IW; x++) {

        screenIdx[i] = rgb2idx(

/* =====================================================================
   12. GAME LOGIC
   ===================================================================== */
const MOVE_SPEED = 3.1, TURN_SPEED = 2.7;

function walkable(x, y) { return mapAt(x, y) === 0; }
function tryMove(ent, dx, dy, radius) {
  const r = radius || 0.22;
  const nx = ent.x + dx, ny = ent.y + dy;
  if (walkable(nx + Math.sign(dx) * r, ent.y)) ent.x = nx;
  if (walkable(ent.x, ny + Math.sign(dy) * r)) ent.y = ny;
}
function lineOfSight(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const dist = Math.hypot(dx, dy);
  const steps = Math.ceil(dist / 0.18);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (mapAt(ax + dx * t, ay + dy * t) > 0) return false;
  }
  return true;
}

const SHOT_COOLDOWN = 0.86;
let lastShot = -10, simTime = 0;

function fireWeapon() {
  if (!fireHeld || player.dead) return;
  if (weapon.state !== 'idle') return;
  if (simTime - lastShot < SHOT_COOLDOWN) return;
  if (player.ammo <= 0) { showMsg('OUT OF SHELLS', 0.8); AudioEngine.noAmmo(); lastShot = simTime - SHOT_COOLDOWN + 0.4; return; }
  lastShot = simTime;
  player.ammo--;
  weapon.state = 'fire'; weapon.t = 0; weapon.frame = 1;
  AudioEngine.shotgun();
  player.faceMode = 'grin'; player.faceTimer = 0.4;

  // 7-pellet spread hitscan
  for (let p = 0; p < 7; p++) {
    const spread = (Math.random() - 0.5) * 0.17;
    const a = player.angle + spread;
    const cos = Math.cos(a), sin = Math.sin(a);
    let best = null, bestD = Infinity;
    for (const e of enemies) {
      if (!e.alive) continue;
      const ex = e.x - player.x, ey = e.y - player.y;
      const along = ex * cos + ey * sin;
      if (along <= 0.2 || along > 22) continue;
      const perp = Math.abs(-ex * sin + ey * cos);
      const radius = ENEMY_DEF[e.kind].worldW * 0.42;
      if (perp > radius) continue;
      if (along < bestD) { bestD = along; best = e; }
    }
    if (best && lineOfSight(player.x, player.y, best.x, best.y)) {
      best.hp -= 11 + Math.random() * 6;
      best.hitT = 0.09;
      best.awake = true;
      if (best.hp <= 0) killEnemy(best);
      else if (Math.random() < 0.4) AudioEngine.growl('pain', 0.7);
    }
  }
}
function killEnemy(e) {
  e.alive = false; e.deathT = 0; e.deathFrame = 0;
  player.kills++;
  AudioEngine.growl('death');
  Voice.speak(KILL_LINES[Math.random() * KILL_LINES.length | 0], 4200);
  showMsg('DEMON SLAIN', 0.9);
}

function updateWeapon(dt) {
  if (weapon.state === 'idle') return;
  weapon.t += dt;
  if (weapon.state === 'fire') {
    weapon.frame = 1;
    if (weapon.t > 0.11) { weapon.state = 'pump1'; weapon.t = 0; weapon.frame = 2; AudioEngine.pump(); }
  } else if (weapon.state === 'pump1') {
    if (weapon.t > 0.22) { weapon.state = 'pump2'; weapon.t = 0; weapon.frame = 3; }
  } else if (weapon.state === 'pump2') {
    if (weapon.t > 0.18) { weapon.state = 'idle'; weapon.t = 0; weapon.frame = 0; }
  }
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.hitT > 0) e.hitT -= dt;
    if (!e.alive) {
      if (e.deathT >= 0) {
        e.deathT += dt;
        e.deathFrame = Math.min(4, Math.floor(e.deathT / 0.11));
      }
      continue;
    }
    const def = ENEMY_DEF[e.kind];
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (e.attackT > 0) e.attackT -= dt;

    if (!e.awake) {
      if (dist < 11 && lineOfSight(e.x, e.y, player.x, player.y)) {
        e.awake = true;
        AudioEngine.growl('sight', Math.max(0.25, 1 - dist / 12));
      }
      continue;
    }
    if (player.dead) continue;

    const sees = lineOfSight(e.x, e.y, player.x, player.y);
    const meleeRange = def.ranged ? 1.15 : 1.35;

    if (dist > meleeRange) {                      // chase
      const spd = def.speed * dt;
      const ux = dx / dist, uy = dy / dist;
      const before = e.x + '' + e.y;
      tryMove(e, ux * spd, uy * spd, 0.3);
      if (before === e.x + '' + e.y) {            // blocked: slide sideways
        tryMove(e, -uy * spd, ux * spd, 0.3);
      }
      e.anim += spd * 4.2;
      e.frame = (e.anim | 0) & 3;
    }

    e.cool -= dt;
    if (e.cool <= 0 && sees) {
      if (dist <= meleeRange) {
        e.cool = def.fireRate;
        e.attackT = 0.3;
        applyDamage(def.melee + Math.random() * def.melee * 0.5);
      } else if (def.ranged && dist < 12) {
        e.cool = def.fireRate;
        e.attackT = 0.35;
        const a = Math.atan2(dy, dx);
        projectiles.push({
          kind: 'fireball', x: e.x + Math.cos(a) * 0.4, y: e.y + Math.sin(a) * 0.4,
          vx: Math.cos(a) * 5.2, vy: Math.sin(a) * 5.2, anim: 0, life: 4
        });
        AudioEngine.fireballShoot();
      }
    }
  }
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.anim += dt * 14;
    p.life -= dt;
    const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
    if (mapAt(nx, ny) > 0 || p.life <= 0) {
      projectiles.splice(i, 1); AudioEngine.explode(); continue;
    }
    p.x = nx; p.y = ny;
    if (!player.dead && Math.hypot(p.x - player.x, p.y - player.y) < 0.42) {
      projectiles.splice(i, 1);
      AudioEngine.explode();
      applyDamage(13 + Math.random() * 9);
    }
  }
}

function updateItems() {
  for (const it of items) {
    if (!it.alive) continue;
    if (Math.hypot(it.x - player.x, it.y - player.y) > 0.55) continue;
    let taken = false;
    if (it.kind === 'shells') {
      if (player.ammo < 60) { player.ammo = Math.min(60, player.ammo + 8); taken = true; showMsg('PICKED UP SHELLS', 1.1); }
    } else if (it.kind === 'medikit') {
      if (player.health < 100) { player.health = Math.min(100, player.health + 25); taken = true; showMsg('PICKED UP A MEDIKIT', 1.1); }
    } else if (it.kind === 'armor') {
      if (player.armor < 100) { player.armor = Math.min(100, player.armor + 50); taken = true; showMsg('PICKED UP ARMOR', 1.1); }
    } else if (it.kind === 'bonus') {
      player.health = Math.min(200, player.health + 2); taken = true; showMsg('HEALTH BONUS', 0.8);
    }
    if (taken) {
      it.alive = false;
      player.pickFlash = 0.5;
      AudioEngine.pickup(it.kind === 'bonus');
    }
  }
}

function applyDamage(dmg) {
  if (player.dead) return;
  let rem = dmg;
  if (player.armor > 0) {
    const abs = Math.min(player.armor, rem * 0.5);
    player.armor -= abs; rem -= abs;
  }
  player.health -= rem;
  player.hurtFlash = 0.7;
  player.faceMode = 'ouch'; player.faceTimer = 0.45;
  AudioEngine.hurt();
  if (player.health <= 25 && player.health > 0 && !lowWarned) {
    lowWarned = true;
    Voice.speak("I'm not gonna make it!", 0);
  }
  if (player.health > 25) lowWarned = false;
  if (player.health <= 0) {
    player.health = 0; player.dead = true;
    AudioEngine.die(); Voice.speak('Ugh...', 0);
    endGame(false);
  }
}

function endGame(won) {
  gameOver = true; gameRunning = false;
  AudioEngine.stopMusic();
  if (won) { AudioEngine.fanfare(); Voice.speak('Hell cleared.', 0); }
  document.getElementById('endScreen').style.display = 'flex';
  document.getElementById('endTitle').textContent = won ? 'MISSION COMPLETE' : 'YOU DIED';
  document.getElementById('endTitle').style.color = won ? '#4fbf3a' : '#d6402a';
  document.getElementById('endSub').textContent = won ? 'THE INSTALLATION IS CLEAR' : 'THE DEMONS WIN';
  document.getElementById('endText').textContent = won
    ? `All ${TOTAL_ENEMIES} demons eliminated. Health left: ${Math.ceil(player.health)}%  ·  Armor: ${Math.ceil(player.armor)}%`
    : `Demons slain: ${player.kills} of ${TOTAL_ENEMIES}`;
}

function update(dt) {
  simTime += dt;

  let turn = lookVec.x * TURN_SPEED;
  if (keys['arrowleft']) turn -= TURN_SPEED;
  if (keys['arrowright']) turn += TURN_SPEED;
  player.angle += turn * dt + mouseDx * 0.0024;
  mouseDx = 0;

  let fwd = -moveVec.y, strafe = moveVec.x;
  if (keys['w']) fwd += 1;
  if (keys['s']) fwd -= 1;
  if (keys['d']) strafe += 1;
  if (keys['a']) strafe -= 1;
  fwd = Math.max(-1, Math.min(1, fwd));
  strafe = Math.max(-1, Math.min(1, strafe));

  if (!player.dead && (fwd !== 0 || strafe !== 0)) {
    const cos = Math.cos(player.angle), sin = Math.sin(player.angle);
    tryMove(player,
      (cos * fwd - sin * strafe) * MOVE_SPEED * dt,
      (sin * fwd + cos * strafe) * MOVE_SPEED * dt, 0.22);
    player.bob += dt * 9.5 * Math.min(1, Math.hypot(fwd, strafe));
  } else {
    player.bob += dt * 1.2;
  }

  fireWeapon();
  updateWeapon(dt);
  updateEnemies(dt);
  updateProjectiles(dt);
  updateItems();

  if (player.faceTimer > 0) {
    player.faceTimer -= dt;
    if (player.faceTimer <= 0) player.faceMode = 'n';
  }
  if (player.hurtFlash > 0) player.hurtFlash -= dt * 1.6;
  if (player.pickFlash > 0) player.pickFlash -= dt * 2.2;
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) msgText = ''; }

  if (!gameOver && player.kills >= TOTAL_ENEMIES) endGame(true);
}

/* =====================================================================
   13. MAIN LOOP  (with adaptive resolution)
   ===================================================================== */
let last = 0, frameAcc = 0, frameCount = 0;

function loop(now) {
  if (!last) last = now;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t0 = performance.now();

  if (gameRunning) update(dt);

  renderWorld();
  renderThings();
  renderOverlays();
  if (!player.dead) renderWeapon();
  renderAutomap();
  renderStatusBar();
  blit();

  // adaptive internal resolution to keep phones smooth
  frameAcc += performance.now() - t0; frameCount++;
  if (frameCount >= 40) {
    const avg = frameAcc / frameCount;
    frameAcc = 0; frameCount = 0;
    if (avg > 15 && resScale < 7) { resScale += 1; setupBuffers(); }
    else if (avg < 5.5 && resScale > 3) { resScale -= 1; setupBuffers(); }
  }
  requestAnimationFrame(loop);
}

/* =====================================================================
   14. UI WIRING
   ===================================================================== */
function goFullscreen() {
  const el = document.documentElement;
  const r = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if (r) { try { r.call(el); } catch (e) {} }
}
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startScreen').style.display = 'none';
  resetGame();
  gameRunning = true;
  goFullscreen();
  AudioEngine.init();
  AudioEngine.startMusic();
  Voice.speak('Rip and tear!', 0);
});
document.getElementById('retryBtn').addEventListener('click', () => {
  document.getElementById('endScreen').style.display = 'none';
  resetGame();
  gameRunning = true;
  AudioEngine.startMusic();
});
document.getElementById('muteBtn').addEventListener('click', () => {
  Muted.on = !Muted.on;
  AudioEngine.setMuted(Muted.on);
  document.getElementById('muteBtn').textContent = Muted.on ? '\u{1F507}' : '\u{1F50A}';
  if (Muted.on && 'speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
});

resetGame();
requestAnimationFrame(loop);
})();
</script>
